name: Deploy to Firebase

# Builds and deploys Hosting plus Firestore/Storage rules on every push to
# main once the repository secrets below exist; otherwise the job is skipped.
#
# Secrets (Settings → Secrets and variables → Actions):
#   FIREBASE_SERVICE_ACCOUNT            JSON key of a service account with
#                                       Firebase Hosting Admin + Firebase Rules Admin
#   FIREBASE_PROJECT_ID
#   VITE_FIREBASE_API_KEY, VITE_FIREBASE_AUTH_DOMAIN, VITE_FIREBASE_STORAGE_BUCKET,
#   VITE_FIREBASE_MESSAGING_SENDER_ID, VITE_FIREBASE_APP_ID,
#   VITE_RECAPTCHA_ENTERPRISE_SITE_KEY

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_SECRETS: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' && secrets.FIREBASE_PROJECT_ID != '' }}
    steps:
      - name: Skip when Firebase secrets are not configured
        if: env.HAS_SECRETS != 'true'
        run: echo "::notice::Deploy skipped — add the Firebase secrets listed in deploy.yml to enable it."
      - uses: actions/checkout@v4
        if: env.HAS_SECRETS == 'true'
      - uses: actions/setup-node@v4
        if: env.HAS_SECRETS == 'true'
        with:
          node-version: 22
          cache: npm
      - if: env.HAS_SECRETS == 'true'
        run: npm ci
      - name: Build
        if: env.HAS_SECRETS == 'true'
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_RECAPTCHA_ENTERPRISE_SITE_KEY: ${{ secrets.VITE_RECAPTCHA_ENTERPRISE_SITE_KEY }}
      - name: Deploy Hosting and security rules
        if: env.HAS_SECRETS == 'true'
        run: |
          echo "$SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json" \
            npx firebase deploy --only hosting,firestore,storage --project "$PROJECT_ID" --non-interactive
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
